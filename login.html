<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar sesión - Marketplace Música</title>

<link rel="stylesheet" href="./css/style.css?v=11">


</head>

<body>


<header>

    <div class="header-inner">

        <a href="./index.html" class="logo">
            Marketplace Música
        </a>

        <nav class="main-nav">

            <a href="./index.html" class="nav-link">
                Inicio
            </a>

            <a href="./albumes.html" class="nav-link">
                Álbumes
            </a>

            <a href="./artistas.html" class="nav-link">
                Artistas
            </a>

        </nav>

        <div class="header-actions">

            <a href="./carrito.html" class="carrito-link">

                <span class="cart-icon">🛒</span>

                <span>
                    Carrito
                </span>

                <span id="contador-carrito">
                    0
                </span>

            </a>

            <a href="./login.html" class="login">
                Iniciar sesión
            </a>

        </div>

    </div>

</header>


<main>

    <div class="login-container">

        <h1>
            Iniciar sesión
        </h1>


        <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            autocomplete="email"
        >


        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
        >


        <button
            id="loginButton"
            type="button"
        >
            Iniciar sesión
        </button>


        <p id="mensaje"></p>


        <hr>


        <p>
            ¿No tenés una cuenta?
        </p>


        <button
            id="registerButton"
            type="button"
        >
            Crear cuenta
        </button>

    </div>

</main>


<footer>

    <p>
        © 2026 Marketplace Música
    </p>

</footer>


<script src="./js/login.js?v=2"></script>


</body>

</html>
