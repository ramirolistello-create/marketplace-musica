<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi biblioteca - Marketplace Música</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        header {
            background: #181818;
            border-bottom: 1px solid #333;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        main > h2 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        #biblioteca {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(250px, 1fr)
            );
            gap: 25px;
        }

        .album-card {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
        }

        .album-card h3 {
            margin-top: 0;
            font-size: 20px;
        }

        .album-card p {
            color: #bbb;
            line-height: 1.5;
        }

        .album-card button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #eee;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .album-card button:hover {
            background: white;
        }

        #biblioteca > p {
            color: #aaa;
        }

    </style>

</head>


<body>

    <header>

        <h1>Marketplace Música</h1>

        <nav>

            <a href="index.html">Inicio</a>

            <a href="index.html">Álbumes</a>

            <a href="#">Artistas</a>

            <a href="biblioteca.html">Mi biblioteca</a>

            <a href="login.html" id="usuarioSesion">
                Iniciar sesión
            </a>

        </nav>

    </header>


    <main>

        <h2>Mi biblioteca</h2>

        <div id="biblioteca">

            <p>Cargando tus compras...</p>

        </div>

    </main>


    <script src="js/biblioteca.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
