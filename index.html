<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Marketplace Música</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=10"
    >

</head>

<body>

<header>

    <div class="header-inner">

        <a
            href="./index.html"
            class="logo"
        >
            Marketplace Música
        </a>


        <nav class="main-nav">

            <a
                href="./index.html"
                class="nav-link active"
            >
                Inicio
            </a>

            <a
                href="./albumes.html"
                class="nav-link"
            >
                Álbumes
            </a>

            <a
                href="./artistas.html"
                class="nav-link"
            >
                Artistas
            </a>

            <a
                href="./biblioteca.html"
                class="nav-link"
            >
                Mi biblioteca
            </a>

        </nav>


        <div class="header-actions">

            <a
                href="./carrito.html"
                class="carrito-link"
            >

                <span class="cart-icon">
                    🛒
                </span>

                <span>
                    Carrito
                </span>

                <span id="contador-carrito">
                    0
                </span>

            </a>


            <a
                href="./login.html"
                class="login"
                id="usuarioSesion"
            >
                Iniciar sesión
            </a>

        </div>

    </div>

</header>


<main>

    <section class="hero">

        <h1>
            Música independiente,<br>
            directamente de sus artistas.
        </h1>


        <p>
            Descubrí nuevos artistas, escuchá su música
            y comprá sus álbumes directamente.
        </p>


        <div class="search">

            <input
                type="text"
                placeholder="Buscar artistas o álbumes..."
                aria-label="Buscar artistas o álbumes"
            >

            <button type="button">
                Buscar
            </button>

        </div>

    </section>


    <section>

        <h2 class="section-title">
            Álbumes destacados
        </h2>


        <div class="albums"></div>

    </section>

</main>


<footer>

    Marketplace Música — Música independiente.

</footer>


<script src="./js/app.js?v=1"></script>

</body>

</html>
